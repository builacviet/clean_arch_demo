services:
  postgres:
    image: postgres:16-alpine
    container_name: clean_arch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clean_arch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clean_arch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: clean_arch_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clean_arch_api
    restart: unless-stopped
    environment:
      DATABASE_ASYNC_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/clean_arch_db
      DATABASE_SYNC_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/clean_arch_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      WEBHOOK_URL: https://partner.com
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
      DB_ECHO: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clean_arch_worker
    restart: unless-stopped
    environment:
      DATABASE_ASYNC_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/clean_arch_db
      DATABASE_SYNC_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/clean_arch_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672/
      WEBHOOK_URL: https://partner.com
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
      DB_ECHO: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      celery -A src.presentation.workers.celery_app worker --loglevel=info

volumes:
  postgres_data:
  rabbitmq_data:
