name: Clean Architecture & Code Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  architecture-and-lint:
    name: Architecture, Lint & Migration Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clean_arch_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clean_arch_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Prepare environment variables
        run: cp .env.example .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          pip install -r requirements.txt
          pip install -e . --no-build-isolation

      - name: Check Code Formatting (Ruff Format)
        run: ruff format --check src tests alembic

      - name: Check Code Quality & Complexity (Ruff Lint)
        run: ruff check src tests alembic

      - name: Check Clean Architecture Boundaries (Import Linter)
        env:
          PYTHONPATH: "."
        run: lint-imports

      - name: Run AST Architecture & Coverage Gate
        env:
          PYTHONPATH: "."
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -v
          coverage report

      - name: Verify Database Migrations (Alembic Check)
        run: |
          alembic upgrade head
          alembic check
