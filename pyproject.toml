[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-arch-demo"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture Layered Dependency"
type = "layers"
layers = ["src.presentation", "src.infrastructure", "src.application", "src.domain"]

[[tool.importlinter.contracts]]
name = "Domain modules must be independent"
type = "independence"
modules = ["src.domain.user", "src.domain.order"]

[[tool.importlinter.contracts]]
name = "Domain and Application cannot touch external IO libraries"
type = "forbidden"
source_modules = ["src.domain", "src.application"]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx", "aio_pika", "pydantic"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]
mccabe = { max-complexity = 10 }

[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ["^alembic/"]
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "src.presentation.workers.*",
]
disallow_untyped_decorators = false

[tool.coverage.run]
branch = true
source = ["src/domain", "src/application"]
omit = [
    "*/__init__.py",
    "*/ports.py",
    "src/application/shared/unit_of_work.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
